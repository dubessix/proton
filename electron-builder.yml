appId: com.harshpandey.iris
productName: IRIS AI
directories:
  buildResources: build

compression: store

files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,credentials.json}"
  - "!models/**/*"
  - "!vectordb/**/*"
  - "!lancedb/**/*"
  - "!userData/**/*"

asarUnpack:
  - resources/**

linux:
  target:
    - target: deb
  maintainer: Harsh Pandey
  category: Utility
  icon: resources/icon.png

deb:
  artifactName: ${name}-${version}.${ext}

npmRebuild: true

publish:
  provider: github
  owner: dubessix
  repo: proton
